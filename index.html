<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Crashdown Arcade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Azonnali színtéma érvényesítés a bevillanás (FOUC) teljes megelőzésére -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("crashdown_theme") || "retro";
          document.documentElement.className = "theme-" + t;
        } catch (e) {}
      })();
    </script>

    <!-- Firebase SDK (Compat - automatikus integráció) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("crashdown_theme") || "retro";
          document.body.className = "theme-" + t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
